# =============================================================================
# SONARQUBE COMMUNITY EDITION PROJECT CONFIGURATION
# =============================================================================

sonar.projectKey=pesan-antar-desa
sonar.projectName=Pesan Antar Desa Platform
sonar.projectVersion=1.0.0

# Source Directories to Scan
sonar.sources=services,frontend/src,mobile

# Exclusions (Ignored Paths)
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*_test.go

# Language Specific Settings
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
